[project]
name = "control-interface-generator"
dynamic = ["version"]
description = "Generates a typed, safety-checked control interface (an MCP server) for Windows programs from what their UI framework exposes."
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "mcp>=1.30",
  "psutil>=7",
  "pywinauto==0.6.9",
  "uiautomation>=2.0.29",
  "comtypes>=1.4",
  "jsonschema>=4",
  "pywin32",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real programs on this machine (deselect with -m 'not live')"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cig", "cig.adapters"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
